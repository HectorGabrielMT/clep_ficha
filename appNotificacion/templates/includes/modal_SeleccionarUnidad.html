<div id="modal-seleccionar-ficha"
     class="fixed inset-0 z-[9999] hidden items-center justify-center bg-black/50 px-4">
    <div class="bg-white w-full max-w-md rounded-xl shadow-xl overflow-hidden">

        <!-- Header -->
        <div class="flex items-center justify-between px-5 py-3 border-b border-slate-200 bg-slate-50">
            <div>
                <h3 class="text-sm font-bold text-slate-800">Asignar Ficha</h3>
                <p id="msf-unidad-nombre" class="text-[11px] text-slate-500"></p>
            </div>
            <button type="button" onclick="modalSeleccionarFicha.cerrar()"
                    class="text-slate-400 hover:text-slate-600 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <!-- Body -->
        <div class="px-5 py-4 max-h-[60vh] overflow-y-auto">

            <div id="msf-cargando" class="flex items-center justify-center py-8 text-slate-400 text-xs">
                <svg class="animate-spin w-4 h-4 mr-2" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                </svg>
                Cargando fichas...
            </div>

            <div id="msf-lista" class="space-y-1.5 hidden"></div>

            <p id="msf-sin-fichas" class="hidden text-xs italic text-slate-400 text-center py-6">
                No hay fichas disponibles para esta unidad.
            </p>

            <p id="msf-error" class="hidden text-xs text-red-600 text-center py-6"></p>

        </div>

        <!-- Footer -->
        <div class="flex items-center justify-end gap-2 px-5 py-3 border-t border-slate-200 bg-slate-50">
            <button type="button" onclick="modalSeleccionarFicha.cerrar()"
                    class="text-[11px] font-semibold uppercase tracking-wide text-slate-500 hover:text-slate-700 px-3 py-2 transition-colors">
                Cancelar
            </button>
            <button type="button" id="msf-btn-guardar" onclick="modalSeleccionarFicha.guardar()"
                    class="inline-flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-[11px] font-bold uppercase tracking-wider py-2 px-4 rounded-lg shadow-sm transition-all">
                Guardar
            </button>
        </div>

    </div>
</div>

<script>
const modalSeleccionarFicha = (function () {

    const URL_OBTENER_FICHAS = "{% url 'obtener_fichas_unidad' %}";
    const URL_ASIGNAR_FICHA  = "{% url 'asignar_ficha_unidad' %}";

    let estado = {
        idCcpp: null,
        idUnidad: null,
        idFichaSeleccionada: null,
    };

    function elementos() {
        return {
            modal:      document.getElementById('modal-seleccionar-ficha'),
            unidadNom:  document.getElementById('msf-unidad-nombre'),
            cargando:   document.getElementById('msf-cargando'),
            lista:      document.getElementById('msf-lista'),
            sinFichas:  document.getElementById('msf-sin-fichas'),
            error:      document.getElementById('msf-error'),
            btnGuardar: document.getElementById('msf-btn-guardar'),
        };
    }

    function obtenerCsrfToken() {
        const match = document.cookie.match(/csrftoken=([^;]+)/);
        if (match) return match[1];
        const input = document.querySelector('input[name="csrfmiddlewaretoken"]');
        return input ? input.value : '';
    }

    async function abrir(idCcpp, idUnidad) {
        if (!idCcpp || !idUnidad) {
            console.error('modalSeleccionarFicha.abrir(): faltan idCcpp / idUnidad', { idCcpp, idUnidad });
            return;
        }

        estado = { idCcpp, idUnidad, idFichaSeleccionada: null };

        const el = elementos();
        el.modal.classList.remove('hidden');
        el.modal.classList.add('flex');
        el.lista.classList.add('hidden');
        el.sinFichas.classList.add('hidden');
        el.error.classList.add('hidden');
        el.cargando.classList.remove('hidden');
        el.lista.innerHTML = '';

        try {
            const params = new URLSearchParams({ id_ccpp: idCcpp, id_unidad: idUnidad });
            const respuesta = await fetch(`${URL_OBTENER_FICHAS}?${params.toString()}`, {
                headers: { 'X-Requested-With': 'XMLHttpRequest' },
            });
            const datos = await respuesta.json();

            el.cargando.classList.add('hidden');

            if (!datos.success) {
                el.error.textContent = datos.error || 'No se pudieron cargar las fichas.';
                el.error.classList.remove('hidden');
                return;
            }

            el.unidadNom.textContent = datos.unidad || '';
            estado.idFichaSeleccionada = datos.ficha_actual_id;

            if (!datos.fichas.length) {
                el.sinFichas.classList.remove('hidden');
                return;
            }

            renderizarLista(datos.fichas, datos.ficha_actual_id);
            el.lista.classList.remove('hidden');

        } catch (error) {
            el.cargando.classList.add('hidden');
            el.error.textContent = 'Error de conexión al cargar las fichas.';
            el.error.classList.remove('hidden');
        }
    }

    function renderizarLista(fichas, idActual) {
        const el = elementos();
        el.lista.innerHTML = '';

        el.lista.appendChild(crearOpcion(null, 'Sin ficha asignada', idActual));
        fichas.forEach(ficha => {
            el.lista.appendChild(crearOpcion(ficha.id, ficha.titulo, idActual));
        });
    }

    function crearOpcion(idFicha, titulo, idActual) {
        const seleccionada = (idFicha === idActual) || (idFicha === null && !idActual);

        const label = document.createElement('label');
        label.className = `flex items-center gap-2.5 px-3 py-2 rounded-lg border cursor-pointer transition-colors
            ${seleccionada ? 'border-indigo-400 bg-indigo-50' : 'border-slate-200 hover:bg-slate-50'}`;
        label.dataset.idFicha = idFicha === null ? '' : idFicha;

        label.innerHTML = `
            <input type="radio" name="msf-ficha" class="w-3.5 h-3.5 text-indigo-600 border-slate-300 focus:ring-indigo-500"
                   ${seleccionada ? 'checked' : ''}>
            <span class="text-xs text-slate-700">${titulo}</span>
        `;

        label.addEventListener('click', () => seleccionarOpcion(idFicha));
        return label;
    }

    function seleccionarOpcion(idFicha) {
        estado.idFichaSeleccionada = idFicha;
        const el = elementos();
        el.lista.querySelectorAll('label').forEach(label => {
            const esEste = label.dataset.idFicha === (idFicha === null ? '' : String(idFicha));
            label.classList.toggle('border-indigo-400', esEste);
            label.classList.toggle('bg-indigo-50', esEste);
            label.classList.toggle('border-slate-200', !esEste);
            label.querySelector('input').checked = esEste;
        });
    }

    async function guardar() {
        const el = elementos();
        el.btnGuardar.disabled = true;
        el.btnGuardar.classList.add('opacity-60', 'cursor-not-allowed');

        try {
            const formData = new FormData();
            formData.append('id_ccpp', estado.idCcpp);
            formData.append('id_unidad', estado.idUnidad);
            formData.append('id_ficha', estado.idFichaSeleccionada || '');
            formData.append('csrfmiddlewaretoken', obtenerCsrfToken());

            const respuesta = await fetch(URL_ASIGNAR_FICHA, {
                method: 'POST',
                body: formData,
                headers: { 'X-Requested-With': 'XMLHttpRequest' },
            });
            const datos = await respuesta.json();

            if (!datos.success) {
                throw new Error(datos.error || 'No se pudo guardar la ficha.');
            }

            if (window.Swal) {
                Swal.fire({
                    title: 'Ficha asignada',
                    text: datos.ficha_titulo ? `Se asignó: ${datos.ficha_titulo}` : 'Se quitó la ficha asignada.',
                    icon: 'success',
                    width: '300px',
                    timer: 1500,
                    showConfirmButton: false,
                });
            }

            cerrar();
            document.dispatchEvent(new CustomEvent('fichaAsignada', { detail: datos }));

        } catch (error) {
            if (window.Swal) {
                Swal.fire({
                    title: 'Error',
                    text: error.message,
                    icon: 'error',
                    width: '300px',
                    confirmButtonText: 'Entendido',
                    customClass: { confirmButton: 'bg-slate-700 text-white text-[10px] font-bold py-2 px-4 rounded-sm' },
                    buttonsStyling: false,
                });
            }
        } finally {
            el.btnGuardar.disabled = false;
            el.btnGuardar.classList.remove('opacity-60', 'cursor-not-allowed');
        }
    }

    function cerrar() {
        const el = elementos();
        el.modal.classList.add('hidden');
        el.modal.classList.remove('flex');
    }

    return { abrir, cerrar, guardar };
})();

/* ── DELEGACIÓN DE EVENTOS ──────────────────────────────────────
   Cualquier botón, en cualquier página, con estos atributos abre
   el modal automáticamente. No requiere onclick ni JS adicional:

   <button data-modal-ficha-trigger
           data-id-ccpp="{{ ccpp.id_ccpp }}"
           data-id-unidad="{{ detalle_inspeccion.id_unidad }}">
       Asignar Ficha
   </button>
------------------------------------------------------------------ */
document.addEventListener('click', function (evento) {
    const trigger = evento.target.closest('[data-modal-ficha-trigger]');
    if (!trigger) return;

    const idCcpp = trigger.dataset.idCcpp;
    const idUnidad = trigger.dataset.idUnidad;

    modalSeleccionarFicha.abrir(idCcpp, idUnidad);
});
</script>
