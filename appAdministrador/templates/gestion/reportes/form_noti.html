<style>
    /* Ajuste para eliminar el padding interno por defecto de SweetAlert2 */
    .swal2-html-container { margin: 0 !important; overflow: hidden !important; }

    /* Ocultar el spinner por defecto de SweetAlert */
    .swal2-loader {
        display: none !important;
    }

    /* Contenedor del cargador personalizado centrado sobre el modal */
    .custom-swal-loader {
        position: absolute;
        inset: 0;
        z-index: 10;
        /* CORREGIDO: Oculto por defecto, usamos JS para ponerlo en flex */
        display: none; 
        align-items: center;
        justify-content: center;
        background-color: rgba(255, 255, 255, 0.9); /* Fondo semi-transparente para bloquear vista */
    }

    /* Animación del punto */
    @keyframes dot-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.5); opacity: 0.5; }
    }
    .animate-dot {
        animation: dot-pulse 1.5s infinite ease-in-out;
    }
</style>

<script>
function abrirFormulario_noti() {
    const filtroAnioExterno = document.getElementById('filtro-anio')?.value;
    Swal.fire({
        showConfirmButton: true,
        showCancelButton: true,
        allowOutsideClick: false, 
        backdrop: true,
        confirmButtonText: 'Exportar Reporte',
        cancelButtonText: 'Cancelar',
        buttonsStyling: false,
        reverseButtons: true,
        width: '450px',
        showLoaderOnConfirm: true,
        allowOutsideClick: () => !Swal.isLoading(),
        customClass: {
            popup: 'rounded-none border border-gray-200 shadow-2xl relative overflow-hidden',
            actions: 'flex justify-end gap-3 w-full px-6 py-4 bg-gray-50 border-t',
            confirmButton: 'bg-slate-800 text-white rounded-full px-6 py-2 text-sm font-semibold hover:bg-slate-900 transition-colors order-2',
            cancelButton: 'border border-gray-300 rounded-full px-6 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors order-1 '
        },
        html: `
            <div class="bg-slate-800 text-white px-6 py-4 text-left rounded-md">
                <p class="text-xs uppercase tracking-widest opacity-70 mb-1">Herramienta <b>Clep</b></p>
                <h2 class="text-xl font-bold tracking-tight">Notificaciones - CCPP{{ ccpp.id_ccpp|stringformat:'03d' }}</h2>
            </div>
            
            <div id="swal-form-content" class="p-6 space-y-5 text-left bg-white">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-2 tracking-wide">Años</label>
                    <select id="swal-anio-relativo" class="w-full border border-gray-300 rounded-md px-3 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-slate-300 focus:border-slate-800 bg-gray-50">
                        {% for a in lista_anios %}
                            <option value="{{ a.indice }}" ${ filtroAnioExterno == "{{ a.indice }}" ? 'selected' : '' }>
                                {{ a.label }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-2 tracking-wide">Período</label>
                    <select id="swal-periodo" class="w-full border border-gray-300 rounded-md px-3 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-slate-300 focus:border-slate-800 bg-gray-50">
                        <option value="1-12" selected>Anual</option>
                        <option value="1-6">1er Semestre</option>
                        <option value="7-12">2do Semestre</option>
                        <option value="1-3">1er Trimestre</option>
                        <option value="4-6">2do Trimestre</option>
                        <option value="7-9">3er Trimestre</option>
                        <option value="10-12">4to Trimestre</option>
                    </select>
                </div>

                <div class="pt-2 space-y-3">
                    <label class="group flex items-center cursor-pointer">
                        <input type="checkbox" id="swal-remitentes" class="w-4 h-4 accent-slate-800 border-gray-300 rounded-none">
                        <span class="ml-3 text-sm text-gray-700 group-hover:text-slate-900">Incluir remitente/s</span>
                    </label>
                    <label class="group flex items-center cursor-pointer">
                        <input type="checkbox" id="swal-respuesta" class="w-4 h-4 accent-slate-800 border-gray-300 rounded-none">
                        <span class="ml-3 text-sm text-gray-700 group-hover:text-slate-900">Incluir respuesta</span>
                    </label>
                </div>
            </div>

            <div id="custom-loader" class="custom-swal-loader">
                <div class="flex items-center gap-3">
                    <div class="w-3 h-3 rounded-full bg-gray-400 animate-dot"></div>
                    <span class="text-xs text-gray-500 tracking-wide select-none">Generando documento de Notificaciones...</span>
                </div>
            </div>
        `,
        preConfirm: () => {
            // 1. Referencias a elementos
            const loader = document.getElementById('custom-loader');
            const actions = Swal.getActions(); // Contenedor de los botones (Exportar/Cancelar)
            
            // 2. Ocultar botones y mostrar el loader personalizado
            if (actions) actions.style.setProperty('display', 'none', 'important');
            loader.style.display = 'flex';
            
            const selectPeriodo = document.getElementById('swal-periodo');
            const periodoValue = selectPeriodo.value.split('-');
            const data = {
                anio_relativo: document.getElementById('swal-anio-relativo').value,
                mes_inicio: periodoValue[0],
                mes_fin: periodoValue[1],
                remitentes: document.getElementById('swal-remitentes').checked ? 'true' : 'false',
                respuesta: document.getElementById('swal-respuesta').checked ? 'true' : 'false',
                periodoNombre: selectPeriodo.options[selectPeriodo.selectedIndex].text.toUpperCase()
            };

            const id_ccpp = "{{ ccpp.id_ccpp }}";
            const url = `/reporte/notificaciones/${id_ccpp}/${data.anio_relativo}/${data.mes_inicio}/${data.mes_fin}/${data.remitentes}/${data.respuesta}/?periodo_nombre=${encodeURIComponent(data.periodoNombre)}`;

            return fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error("Error generando reporte");
                    return response.blob();
                })
                .then(blob => {
                    // Descarga del archivo
                    const link = document.createElement('a');
                    link.href = window.URL.createObjectURL(blob);
                    link.download = `reporte_notificaciones_${data.periodoNombre.toLowerCase()}.pdf`;
                    document.body.appendChild(link);
                    link.click();
                    link.remove();

                    // 3. Mostrar mensaje de éxito en el centro del modal
                    loader.innerHTML = `
                        <div class="flex flex-col items-center gap-2">
                            <span class="text-emerald-600 font-bold text-xl tracking-tight">¡Listo!</span>
                            <span class="text-xs text-gray-400">El reporte se ha generado con éxito</span>
                        </div>
                    `;

                    // 4. Pausa antes de cerrar para que el usuario vea el "¡Listo!"
                    setTimeout(() => {
                        Swal.close();
                    }, 2000);

                    return false; // Evita el cierre automático de SweetAlert
                })
                .catch(error => {
                    // En caso de error, volvemos a mostrar los botones para que el usuario pueda reintentar o cancelar
                    if (actions) actions.style.display = 'flex';
                    loader.style.display = 'none';
                    Swal.showValidationMessage(`Error: ${error.message}`);
                });
        }
    });
}
</script>
