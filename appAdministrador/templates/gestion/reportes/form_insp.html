<script>

    
    function abrirModalInspecciones() {
    const filtroAnioExterno = document.getElementById('filtro-anio')?.value;
    const id_ccpp = "{{ ccpp.id_ccpp }}";
    const ccpp_formateado = id_ccpp.toString().padStart(3, '0');
    
    Swal.fire({
        showConfirmButton: true,
        showCancelButton: true,
        allowOutsideClick: false,
        backdrop: true,
        confirmButtonText: 'Exportar Reporte',
        cancelButtonText: 'Cancelar',
        buttonsStyling: false,
        reverseButtons: true,
        width: '450px',
        showLoaderOnConfirm: true,
        allowOutsideClick: () => !Swal.isLoading(),
        customClass: {
            popup: 'rounded-none border border-gray-200 shadow-2xl relative overflow-hidden',
            actions: 'flex justify-end gap-3 w-full px-6 py-4 bg-gray-50 border-t',
            confirmButton: 'bg-slate-800 text-white rounded-full px-6 py-2 text-sm font-semibold hover:bg-slate-900 transition-colors order-2',
            cancelButton: 'border border-gray-300 rounded-full px-6 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors order-1'
        },
        html: `
            <div class="bg-slate-800 text-white px-6 py-4 text-left rounded-md">
                <p class="text-xs uppercase tracking-widest opacity-70 mb-1">Herramienta <b>Clep</b></p>
                <h2 class="text-xl font-bold tracking-tight">Inspecciones - CCPP${ccpp_formateado}</h2>
            </div>
            
            <div id="swal-form-content" class="p-6 space-y-5 text-left bg-white">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-2 tracking-wide">Años</label>
                    <select id="swal-inspeccion-anio-relativo" class="w-full border border-gray-300 rounded-md px-3 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-slate-300 focus:border-slate-800 bg-gray-50">
                        {% for a in lista_anios %}
                            <option value="{{ a.indice }}" ${ filtroAnioExterno == "{{ a.indice }}" ? 'selected' : '' }>
                                {{ a.label }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-2 tracking-wide">Período</label>
                    <select id="swal-inspeccion-periodo" class="w-full border border-gray-300 rounded-md px-3 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-slate-300 focus:border-slate-800 bg-gray-50">
                        <option value="1-12" selected>Anual</option>
                        <option value="1-6">1er Semestre</option>
                        <option value="7-12">2do Semestre</option>
                        <option value="1-3">1er Trimestre</option>
                        <option value="4-6">2do Trimestre</option>
                        <option value="7-9">3er Trimestre</option>
                        <option value="10-12">4to Trimestre</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-2 tracking-wide">Filtro de Unidades</label>
                    <select id="swal-inspeccion-filtro" class="w-full border border-gray-300 rounded-md px-3 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-slate-300 focus:border-slate-800 bg-gray-50">
                        <option value="todas" selected>Todas las unidades</option>
                        <optgroup label="Inspecciones">
                            <option value="con_inspeccion">Con inspección</option>
                            <option value="sin_inspeccion">Sin inspección</option>
                        </optgroup>
                        <optgroup label="Notificaciones">
                            <option value="con_notificacion">Con notificación</option>
                            <option value="sin_notificacion">Sin notificación</option>
                        </optgroup>
                        <optgroup label="Respuestas">
                            <option value="con_respuesta">Con respuesta</option>
                            <option value="sin_respuesta">Sin respuesta</option>
                        </optgroup>
                    </select>
                </div>
            </div>

            <div id="custom-loader" class="custom-swal-loader">
                <div class="flex items-center gap-3">
                    <div class="w-3 h-3 rounded-full bg-gray-400 animate-dot"></div>
                    <span class="text-xs text-gray-500 tracking-wide select-none">Generando documento de Inspecciones...</span>
                </div>
            </div>
        `,
        preConfirm: () => {
            // 1. Ocultar botones y mostrar loader
            const loader = document.getElementById('custom-loader');
            const actions = Swal.getActions();
            if (actions) actions.style.setProperty('display', 'none', 'important');
            loader.style.display = 'flex';
            
            const selectPeriodo = document.getElementById('swal-inspeccion-periodo');
            const periodoValue = selectPeriodo.value.split('-');
            const data = {
                anio: document.getElementById('swal-inspeccion-anio-relativo').value,
                mes_inicio: periodoValue[0],
                mes_fin: periodoValue[1],
                filtro: document.getElementById('swal-inspeccion-filtro').value,
                periodoNombre: selectPeriodo.options[selectPeriodo.selectedIndex].text.toUpperCase()
            };

            const url = `/reporte/inspecciones/${id_ccpp}/${data.anio}/?periodo=${data.mes_inicio}-${data.mes_fin}&filtro=${data.filtro}&periodo_nombre=${encodeURIComponent(data.periodoNombre)}`;

            return fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error("Error generando reporte");
                    return response.blob();
                })
                .then(blob => {
                    const link = document.createElement('a');
                    link.href = window.URL.createObjectURL(blob);
                    link.download = `reporte_inspecciones_${data.periodoNombre.toLowerCase()}_${data.filtro}.pdf`;
                    document.body.appendChild(link);
                    link.click();
                    link.remove();

                    // 2. Mostrar mensaje de "¡Listo!"
                    loader.innerHTML = `
                        <div class="flex flex-col items-center gap-2 animate-in fade-in zoom-in duration-300">
                            <span class="text-emerald-600 font-bold text-xl tracking-tight">¡Listo!</span>
                            <span class="text-xs text-gray-400 text-center px-6">El reporte de inspecciones se ha generado correctamente</span>
                        </div>
                    `;

                    // 3. Retornar false para manejar el cierre manualmente
                    setTimeout(() => {
                        Swal.close();
                    }, 2000);

                    return false; 
                })
                .catch(error => {
                    // Si hay error, restauramos la vista para que el usuario pueda corregir
                    if (actions) actions.style.display = 'flex';
                    loader.style.display = 'none';
                    Swal.showValidationMessage(`Error: ${error.message}`);
                });
        }
    });
}


</script>

<style>
    /* Ajuste para eliminar el padding interno por defecto de SweetAlert2 */
    .swal2-html-container { 
        margin: 0 !important; 
        overflow: hidden !important; 
    }

    /* Ocultar el spinner por defecto de SweetAlert */
    .swal2-loader {
        display: none !important;
    }

    /* Contenedor del cargador personalizado centrado sobre el modal */
    .custom-swal-loader {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: none;
        align-items: center;
        justify-content: center;
        background-color: rgba(255, 255, 255, 0.9);
    }

    /* Animación del punto */
    @keyframes dot-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.5); opacity: 0.5; }
    }
    .animate-dot {
        animation: dot-pulse 1.5s infinite ease-in-out;
    }
</style>
