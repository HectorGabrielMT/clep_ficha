<div id="modal-confirmacion-global" class="fixed top-6 right-6 z-[10000] hidden w-full max-w-sm transition-all duration-600 ease-[cubic-bezier(0.4,0,0.2,1)] opacity-0 translate-x-full">
    <div class="message-item relative overflow-hidden rounded-2xl bg-white/90 backdrop-blur-md border border-white/20 shadow-[0_8px_32px_0_rgba(31,38,135,0.2)] hover:translate-y-[-2px] transition-transform duration-500 pointer-events-auto">
        
        <div class="p-4 flex items-start">
            <div class="flex-shrink-0 flex items-center justify-center w-10 h-10 rounded-full bg-red-100 text-red-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                </svg>
            </div>

            <div class="ml-4 flex-1">
                <p id="modal-global-titulo" class="text-sm font-bold text-gray-900 leading-tight">¿Confirmar acción?</p>
                <p id="modal-global-mensaje" class="text-[13px] text-gray-600 mt-1">Esta acción es irreversible.</p>
                
                <div class="flex gap-2 mt-4">
                    <form id="form-confirmacion-global" method="POST" class="flex-1">
                        {% csrf_token %}
                        <button type="submit" class="w-full px-3 py-1.5 bg-red-600 text-white rounded-lg font-bold text-[11px] uppercase tracking-wider hover:bg-red-700 transition-colors">
                            Si, eliminar
                        </button>
                    </form>
                    
                    <button onclick="cerrarModalGlobal()" class="flex-1 px-3 py-1.5 bg-gray-100 text-gray-700 rounded-lg font-bold text-[11px] uppercase tracking-wider hover:bg-gray-200 transition-colors focus:outline-none">
                        Cancelar
                    </button>
                </div>
            </div>

            <button onclick="cerrarModalGlobal()" class="ml-2 text-gray-400 hover:text-gray-600 transition-colors">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <div class="h-1 w-full bg-gray-100/50">
            <div class="h-full bg-red-500 w-full animate-pulse"></div>
        </div>
    </div>
</div>


<script>
    /**
    * Abre el modal de confirmación con datos personalizados
    * @param {string} url - La URL que procesará la eliminación (action del form)
    * @param {string} titulo - (Opcional) Título del modal
    * @param {string} mensaje - (Opcional) Cuerpo del mensaje
    */
    function abrirModalConfirmacion(url, titulo = "¿Estás seguro?", mensaje = "Esta acción es irreversible.") {
        const modal = document.getElementById('modal-confirmacion-global');
        const form = document.getElementById('form-confirmacion-global');
        const txtTitulo = document.getElementById('modal-global-titulo');
        const txtMensaje = document.getElementById('modal-global-mensaje');

        // Asignar los valores dinámicos
        form.action = url;
        txtTitulo.innerText = titulo;
        txtMensaje.innerText = mensaje;

        // Mostrar modal con animación
        modal.classList.remove('hidden');
        
        // Pequeño timeout para que el navegador registre que ya no es hidden 
        // y ejecute la animación de entrada
        setTimeout(() => {
            modal.classList.remove('opacity-0', 'translate-x-full');
        }, 20);
    }

    function cerrarModalGlobal() {
        const modal = document.getElementById('modal-confirmacion-global');

        // Animación de salida
        modal.classList.add('opacity-0', 'translate-x-full');

        // Esperar a que termine la transición para ocultar el elemento
        setTimeout(() => {
            modal.classList.add('hidden');
        }, 600);
    }

    // Opcional: Cerrar al presionar la tecla ESC
    document.addEventListener('keydown', (e) => {
        if (e.key === "Escape") cerrarModalGlobal();
    });
</script>
